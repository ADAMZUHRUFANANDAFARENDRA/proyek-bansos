<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Eksekutif Dinsos - Pemkab Sidoarjo</title>
    
    <!-- LIBRARIES -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <!-- MEMANGGIL FILE CSS EKSTERNAL -->
    <link rel="stylesheet" href="static/css/style.css">
    <link rel="stylesheet" href="static/css/login.css">
</head>
<body class="page-login">

    <!-- Navigasi Melayang -->
    <button onclick="mulaiTurLogin()" class="tutorial-link"><i class="fas fa-question-circle"></i> Panduan Login</button>
    <a href="publik.html" class="public-portal-link">Portal Warga <i class="fas fa-arrow-right"></i></a>

    <!-- TOMBOL LINGKARAN CEK BPS -->
    <div class="bps-circle-btn" onclick="cekDataBPS()" title="Cek Sinkronisasi Data BPS Sidoarjo">
        <i class="fas fa-database"></i>
        <span>Cek BPS</span>
    </div>

    <!-- FORM LOGIN UTAMA -->
    <div class="login-wrapper">
        <div class="login-header">
            <div class="logo-box"><i class="fas fa-fingerprint"></i></div>
            <h2>Akses Internal Dinas</h2>
            <p>Pemerintah Kabupaten Sidoarjo</p>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label class="form-label">Username Pegawai</label>
                <div class="input-wrapper">
                    <input type="text" id="username" class="form-input" required autocomplete="off" placeholder="Ketik username Anda">
                    <i class="fas fa-user input-icon"></i>
                </div>
            </div>

            <div class="form-group">
                <div class="form-label">
                    <span>Kata Sandi Akses</span>
                    <a class="forgot-link" onclick="openResetModal()">Lupa Sandi?</a>
                </div>
                <div class="input-wrapper">
                    <input type="password" id="password" class="form-input" required placeholder="Ketik kata sandi rahasia">
                    <i class="fas fa-lock input-icon"></i>
                    <button type="button" class="toggle-password" onclick="togglePassword('password', 'eyeIcon')"><i class="fas fa-eye" id="eyeIcon"></i></button>
                </div>
            </div>

            <div id="cf-challenge" class="cf-box">
                <div class="cf-spinner" id="cf-spinner"></div>
                <i class="fas fa-shield-check cf-success" id="cf-success"></i>
                <span id="cf-text" class="cf-text">Memverifikasi koneksi peladen...</span>
            </div>

            <div class="captcha-box" id="captchaBox" style="display: none;">
                <div class="captcha-text"><i class="fas fa-robot"></i> <span id="captchaQuestion">5 + 3 =</span></div>
                <input type="number" id="captchaAnswer" class="captcha-input" placeholder="Hasil?">
            </div>

            <button type="submit" class="btn-login" id="btnSubmit" disabled>Verifikasi Tertunda <i class="fas fa-shield-alt"></i></button>
        </form>
    </div>

    <!-- MODAL LUPA PASSWORD -->
    <div class="modal-blur" id="resetModal">
        <div class="modal-card">
            <h3 style="margin: 0 0 12px 0; color: var(--text-main); font-size:1.6rem; font-weight:800;"><i class="fas fa-key" style="color:var(--primary);"></i> Pemulihan Akun</h3>
            <p style="font-size: 0.95rem; color: var(--text-muted); margin-bottom: 25px; line-height:1.6; font-weight:500;">Masukkan Kode Akses Rahasia khusus dari Pemkab Sidoarjo untuk mengatur ulang sandi.</p>
            
            <form onsubmit="resetPassword(event)" style="padding:0;">
                <div class="form-group">
                    <label class="form-label">Username yang Lupa</label>
                    <input type="text" id="resetUser" class="form-input" style="padding:14px 18px;" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Kode Rahasia Dinas</label>
                    <input type="password" id="resetCode" class="form-input" style="padding:14px 18px;" placeholder="SIDOARJO-..." required>
                </div>
                <div class="form-group">
                    <label class="form-label">Kata Sandi Baru</label>
                    <input type="password" id="resetNewPass" class="form-input" style="padding:14px 18px;" required>
                </div>
                <div style="display: flex; gap: 12px; margin-top: 30px;">
                    <button type="button" class="btn-login" style="background: var(--bg-base); color: #475569; box-shadow:none; border:1px solid var(--border);" onclick="closeResetModal()">Batal</button>
                    <button type="submit" class="btn-login" style="margin-top:0;">Simpan Sandi Baru <i class="fas fa-check-circle"></i></button>
                </div>
            </form>
        </div>
    </div>

    <!-- MEMANGGIL FILE JAVASCRIPT EKSTERNAL -->
    <script src="static/js/login.js"></script>
</body>
</html>
