<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Eksekutif Dinsos - Pemkab Sidoarjo</title>
    
    <!-- LIBRARIES CSS & FONTS -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <!-- FILE CSS EKSTERNAL -->
    <link rel="stylesheet" href="static/css/style.css">
    <link rel="stylesheet" href="static/css/login.css">

    <style>
        /* =========================================================================
           1. VARIABEL WARNA & TEMA UTAMA (FRESH EMERALD MESH THEME)
           ========================================================================= */
        :root {
            --primary: #10b981;
            --primary-dark: #059669;
            --primary-deep: #022c22;
            --primary-light: #ecfdf5;
            --accent: #f59e0b;
            --accent-dark: #d97706;
            --info: #0284c7;
            --info-light: #e0f2fe;
            --danger: #ef4444;
            --danger-light: #fee2e2;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --bg-base: #f8fafc;
            --border: #e2e8f0;
            --border-focus: #10b981;
            --shadow-card: 0 25px 50px -12px rgba(0, 0, 0, 0.38);
            --shadow-glow: 0 0 25px rgba(16, 185, 129, 0.25);
            --radius-card: 26px;
            --radius-btn: 12px;
        }

        /* =========================================================================
           2. RESET & BASE LAYOUT
           ========================================================================= */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        html, body {
            width: 100%;
            height: 100%;
        }

        /* LATAR BELAKANG MESH GRADIENT MODERN & SEGAR */
        body.page-login {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: 
                radial-gradient(circle at 15% 15%, rgba(52, 211, 153, 0.42) 0%, transparent 45%),
                radial-gradient(circle at 85% 85%, rgba(5, 150, 105, 0.52) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(4, 120, 87, 0.65) 0%, transparent 65%),
                linear-gradient(135deg, #064e3b 0%, #022c22 100%) !important;
            background-attachment: fixed !important;
            padding: 25px 15px;
            position: relative;
            overflow-x: hidden;
            overflow-y: auto;
        }

        /* =========================================================================
           3. ORNAMEN KISI DIGITAL & AMBIENT GLOW
           ========================================================================= */
        .bg-grid-pattern {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: 34px 34px;
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.045) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.045) 1px, transparent 1px);
            pointer-events: none;
            z-index: 2;
        }

        .ambient-glow {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(16, 185, 129, 0.25) 0%, rgba(5, 150, 105, 0) 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            pointer-events: none;
            filter: blur(65px);
            z-index: 1;
            animation: pulseGlow 10s infinite alternate ease-in-out;
        }

        @keyframes pulseGlow {
            0% {
                transform: translate(-50%, -50%) scale(0.95);
                opacity: 0.8;
            }
            100% {
                transform: translate(-50%, -50%) scale(1.08);
                opacity: 1;
            }
        }

        /* =========================================================================
           4. TOMBOL NAVIGASI MELAYANG (FLOATING BUTTONS)
           ========================================================================= */
        .tutorial-link, .public-portal-link {
            position: absolute;
            top: 22px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            color: var(--text-main);
            padding: 10px 20px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 0.84rem;
            text-decoration: none;
            box-shadow: 0 8px 22px rgba(0, 0, 0, 0.15);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            border: 1px solid rgba(255, 255, 255, 0.8);
            cursor: pointer;
            transition: all 0.25s ease;
            z-index: 50;
        }

        .tutorial-link {
            left: 24px;
        }

        .public-portal-link {
            right: 24px;
            color: var(--primary-dark);
        }

        .tutorial-link:hover, .public-portal-link:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 26px rgba(0, 0, 0, 0.25);
            background: #ffffff;
        }

        /* TOMBOL BULAT CEK BPS */
        .bps-circle-btn {
            position: fixed;
            bottom: 24px;
            right: 24px;
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, #0284c7, #0369a1);
            color: white;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(2, 132, 199, 0.45);
            transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
            font-size: 0.68rem;
            font-weight: 800;
            z-index: 100;
            border: 2px solid rgba(255, 255, 255, 0.6);
        }

        .bps-circle-btn i {
            font-size: 1.3rem;
            margin-bottom: 2px;
        }

        .bps-circle-btn:hover {
            transform: scale(1.08) translateY(-3px);
            box-shadow: 0 14px 30px rgba(2, 132, 199, 0.6);
        }

        /* =========================================================================
           5. KARTU LOGIN GLASSMORPHIC
           ========================================================================= */
        .login-wrapper {
            width: 100%;
            max-width: 420px;
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: var(--radius-card);
            padding: 30px 34px;
            box-shadow: var(--shadow-card);
            position: relative;
            z-index: 10;
            border: 1px solid rgba(255, 255, 255, 0.88);
            margin: auto;
            animation: popCard 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes popCard {
            from {
                opacity: 0;
                transform: scale(0.96) translateY(12px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .login-header {
            text-align: center;
            margin-bottom: 18px;
        }

        .logo-box {
            width: 58px;
            height: 58px;
            background: linear-gradient(135deg, #ecfdf5, #d1fae5);
            color: #059669;
            border-radius: 16px;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            font-size: 1.65rem;
            margin-bottom: 8px;
            box-shadow: 0 6px 14px rgba(16, 185, 129, 0.2);
            border: 1px solid rgba(16, 185, 129, 0.25);
        }

        .login-header h2 {
            font-size: 1.42rem;
            font-weight: 800;
            color: var(--text-main);
            margin-bottom: 2px;
            letter-spacing: -0.3px;
        }

        .login-header p {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        /* =========================================================================
           6. FORM INPUT & INTERAKSI
           ========================================================================= */
        .form-group {
            margin-bottom: 13px;
        }

        .form-label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            font-weight: 700;
            color: #334155;
            margin-bottom: 5px;
        }

        .forgot-link {
            color: #059669;
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
            transition: color 0.2s ease;
        }

        .forgot-link:hover {
            color: #047857;
            text-decoration: underline;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 14px;
            color: #94a3b8;
            font-size: 0.92rem;
            pointer-events: none;
        }

        .form-input {
            width: 100%;
            padding: 10px 40px 10px 38px;
            border: 2px solid var(--border);
            border-radius: 12px;
            font-size: 0.91rem;
            font-weight: 500;
            background: #f8fafc;
            color: var(--text-main);
            outline: none;
            transition: all 0.2s ease;
        }

        .form-input:focus {
            border-color: #10b981;
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.15);
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            background: none;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* CLOUDFLARE ENCRYPTION STATUS BOX */
        .cf-box {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 9px 12px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: #f8fafc;
            margin-bottom: 12px;
        }

        .cf-spinner {
            width: 15px;
            height: 15px;
            border: 2.5px solid #cbd5e1;
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .cf-success {
            color: #10b981;
            font-size: 1.1rem;
            display: none;
        }

        .cf-text {
            font-size: 0.8rem;
            color: #475569;
            font-weight: 600;
        }

        /* CAPTCHA CHALLENGE BOX */
        .captcha-box {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #fef3c7;
            padding: 9px 12px;
            border-radius: 12px;
            border: 1px dashed var(--accent);
            margin-bottom: 15px;
        }

        .captcha-text {
            font-weight: 800;
            font-size: 0.92rem;
            color: #b45309;
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .captcha-input {
            width: 76px;
            padding: 6px;
            border: 2px solid #fcd34d;
            border-radius: 8px;
            text-align: center;
            font-weight: 800;
            font-size: 0.92rem;
            outline: none;
            background: #ffffff;
        }

        /* =========================================================================
           7. TOMBOL LOGIN RESMI
           ========================================================================= */
        .btn-login {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: #ffffff;
            border: none;
            border-radius: var(--radius-btn);
            font-size: 0.98rem;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 6px 18px rgba(16, 185, 129, 0.35);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            letter-spacing: 0.3px;
        }

        .btn-login:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 22px rgba(16, 185, 129, 0.45);
        }

        .btn-login:active:not(:disabled) {
            transform: translateY(0);
        }

        .btn-login:disabled {
            background: #cbd5e1;
            cursor: not-allowed;
            box-shadow: none;
        }

        /* =========================================================================
           8. MODAL PEMULIHAN AKUN (LUPA SANDI)
           ========================================================================= */
        .modal-blur {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            z-index: 2000;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-card {
            background: #ffffff;
            padding: 28px;
            border-radius: 22px;
            width: 100%;
            max-width: 410px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.35);
        }
    </style>
</head>
<body class="page-login">

    <!-- TEKSTUR KISI DIGITAL & AMBIENT GLOW -->
    <div class="bg-grid-pattern"></div>
    <div class="ambient-glow"></div>

    <!-- NAVIGASI MELAYANG -->
    <button type="button" onclick="mulaiTurLogin()" class="tutorial-link"><i class="fas fa-question-circle"></i> Panduan Login</button>
    <a href="publik.html" class="public-portal-link">Portal Warga <i class="fas fa-arrow-right"></i></a>

    <!-- TOMBOL BULAT CEK BPS -->
    <div class="bps-circle-btn" onclick="cekDataBPS()" title="Cek Status Bansos Berdasarkan NIK (Data BPS Sidoarjo)">
        <i class="fas fa-database"></i>
        <span>Cek BPS</span>
    </div>

    <!-- KARTU FORM LOGIN UTAMA -->
    <div class="login-wrapper">
        <div class="login-header">
            <div class="logo-box"><i class="fas fa-fingerprint"></i></div>
            <h2>Akses Internal Dinas</h2>
            <p>Pemerintah Kabupaten Sidoarjo</p>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label class="form-label">Username Pegawai</label>
                <div class="input-wrapper">
                    <input type="text" id="username" class="form-input" required autocomplete="off" placeholder="Ketik username Anda">
                    <i class="fas fa-user input-icon"></i>
                </div>
            </div>

            <div class="form-group">
                <div class="form-label">
                    <span>Kata Sandi Akses</span>
                    <a class="forgot-link" onclick="openResetModal()">Lupa Sandi?</a>
                </div>
                <div class="input-wrapper">
                    <input type="password" id="password" class="form-input" required placeholder="Ketik kata sandi Anda">
                    <i class="fas fa-lock input-icon"></i>
                    <button type="button" class="toggle-password" onclick="togglePassword('password', 'eyeIcon')"><i class="fas fa-eye" id="eyeIcon"></i></button>
                </div>
            </div>

            <div id="cf-challenge" class="cf-box">
                <div class="cf-spinner" id="cf-spinner"></div>
                <i class="fas fa-shield-check cf-success" id="cf-success"></i>
                <span id="cf-text" class="cf-text">Memverifikasi koneksi peladen...</span>
            </div>

            <div class="captcha-box" id="captchaBox" style="display: none;">
                <div class="captcha-text"><i class="fas fa-robot"></i> <span id="captchaQuestion">4 + 5 =</span></div>
                <input type="number" id="captchaAnswer" class="captcha-input" placeholder="Hasil?">
            </div>

            <!-- Tombol Login Resmi -->
            <button type="submit" class="btn-login" id="btnSubmit" disabled>Login <i class="fas fa-sign-in-alt"></i></button>
        </form>
    </div>

    <!-- MODAL LUPA PASSWORD -->
    <div class="modal-blur" id="resetModal">
        <div class="modal-card">
            <h3 style="margin: 0 0 10px 0; color: var(--text-main); font-size:1.3rem; font-weight:800;"><i class="fas fa-key" style="color:#059669;"></i> Pemulihan Akun</h3>
            <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 18px; line-height:1.5; font-weight:500;">Silakan ajukan permintaan reset kata sandi kepada Administrator Database.</p>
            
            <form onsubmit="handleResetPassword(event)" style="padding:0;">
                <div class="form-group">
                    <label class="form-label">Username</label>
                    <input type="text" id="resetUser" class="form-input" placeholder="Masukkan username Anda" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Kata Sandi Baru yang Diinginkan</label>
                    <input type="password" id="resetNewPass" class="form-input" placeholder="Minimal 6 karakter" required>
                </div>
                <div style="display: flex; gap: 10px; margin-top: 18px;">
                    <button type="button" class="btn-login" style="background: var(--bg-base); color: #475569; box-shadow:none; border:1px solid var(--border);" onclick="closeResetModal()">Batal</button>
                    <button type="submit" class="btn-login" style="margin-top:0;">Kirim Pengajuan <i class="fas fa-paper-plane"></i></button>
                </div>
            </form>
        </div>
    </div>

    <!-- =========================================================================
         SCRIPT LOGIKA LOGIN MANDIRI (FULL INLINE JAVASCRIPT)
         ========================================================================= -->
    <script>
        const API_URL = "http://127.0.0.1:5000";
        let expectedCaptcha = 0;
        let isSecure = false;

        // Bersihkan token kedaluwarsa setiap kali halaman login dibuka
        localStorage.clear();

        window.onload = () => {
            // Trigger inisialisasi basis data jika baru pertama dijalankan
            fetch(`${API_URL}/init-kriteria`, { method: 'GET' }).catch(() => {});

            // Simulasi Verifikasi Enkripsi Peladen (800ms)
            setTimeout(() => {
                const spinner = document.getElementById('cf-spinner');
                const successIcon = document.getElementById('cf-success');
                const cfText = document.getElementById('cf-text');
                const captchaBox = document.getElementById('captchaBox');
                const btnSubmit = document.getElementById('btnSubmit');

                if (spinner) spinner.style.display = 'none';
                if (successIcon) successIcon.style.display = 'block';
                if (cfText) cfText.innerText = 'Koneksi Peladen Terenkripsi.';
                if (captchaBox) captchaBox.style.display = 'flex';

                generateCaptcha();

                if (btnSubmit) {
                    btnSubmit.disabled = false;
                    btnSubmit.innerHTML = 'Login <i class="fas fa-sign-in-alt"></i>';
                }
                isSecure = true;
            }, 800);
        };

        function generateCaptcha() {
            const num1 = Math.floor(Math.random() * 9) + 1;
            const num2 = Math.floor(Math.random() * 9) + 1;
            expectedCaptcha = num1 + num2;
            const qEl = document.getElementById('captchaQuestion');
            const ansEl = document.getElementById('captchaAnswer');
            if (qEl) qEl.innerText = `${num1} + ${num2} =`;
            if (ansEl) ansEl.value = '';
        }

        function togglePassword(inputId, iconId) {
            const pwd = document.getElementById(inputId);
            const eye = document.getElementById(iconId);
            if (pwd && eye) {
                if (pwd.type === 'password') {
                    pwd.type = 'text';
                    eye.className = 'fas fa-eye-slash';
                } else {
                    pwd.type = 'password';
                    eye.className = 'fas fa-eye';
                }
            }
        }

        // 1. PANDUAN ALUR LOGIN RESMI
        function mulaiTurLogin() {
            Swal.fire({
                title: 'Panduan Alur Akses Sistem',
                html: `
                    <div style="text-align:left; font-size:0.9rem; line-height:1.7; color:#334155;">
                        <div style="margin-bottom:12px; padding:10px; background:#f0fdf4; border-radius:10px; border-left:4px solid #10b981;">
                            <b>1. Pegawai / Petugas Dinas:</b><br>
                            Gunakan formulir login di tengah layar dengan kredensial resmi instansi Anda. Sistem akan mengarahkan ke dashboard eksekutif sesuai hak akses akun.
                        </div>
                        <div style="margin-bottom:12px; padding:10px; background:#f0f9ff; border-radius:10px; border-left:4px solid #0284c7;">
                            <b>2. Akses Masyarakat / Warga:</b><br>
                            Masyarakat umum tidak perlu login di halaman ini. Silakan klik tombol <b>"Portal Warga"</b> di pojok kanan atas untuk pendaftaran mandiri atau pengecekan status.
                        </div>
                        <div style="padding:10px; background:#fef3c7; border-radius:10px; border-left:4px solid #f59e0b;">
                            <b>3. Pengecekan Data BPS Terpadu:</b><br>
                            Klik tombol lingkaran biru <b>"Cek BPS"</b> di pojok kanan bawah untuk mengecek status desil NIK secara langsung.
                        </div>
                    </div>
                `,
                icon: 'info',
                confirmButtonText: 'Saya Mengerti',
                confirmButtonColor: '#10b981'
            });
        }

        // 2. FITUR CEK DATA BPS DENGAN INPUT 16 DIGIT NIK
        async function cekDataBPS() {
            const { value: nik } = await Swal.fire({
                title: '<i class="fas fa-database text-primary"></i> Cek Data BPS Sidoarjo',
                html: '<p style="font-size:0.88rem; color:#64748b; margin-bottom:12px;">Masukkan 16 digit NIK untuk memeriksa status DTKS / DTSEN BPS Sidoarjo:</p>',
                input: 'text',
                inputPlaceholder: 'Contoh: 3515xxxxxxxxxxxx',
                inputAttributes: {
                    maxlength: '16',
                    autocapitalize: 'off',
                    autocorrect: 'off'
                },
                showCancelButton: true,
                confirmButtonText: '<i class="fas fa-search"></i> Cek Status',
                cancelButtonText: 'Batal',
                confirmButtonColor: '#10b981',
                cancelButtonColor: '#94a3b8',
                inputValidator: (value) => {
                    if (!value || value.trim().length !== 16 || !/^\d+$/.test(value.trim())) {
                        return 'Mohon masukkan tepat 16 digit angka NIK!';
                    }
                }
            });

            if (nik) {
                Swal.fire({
                    title: 'Memeriksa Basis Data...',
                    html: `Mencocokkan NIK <b>${nik}</b> dengan basis data BPS & DTSEN...`,
                    allowOutsideClick: false,
                    didOpen: () => Swal.showLoading()
                });

                try {
                    const res = await fetch(`${API_URL}/api/public/cek-bansos/${nik}`);
                    const json = await res.json();

                    if (res.ok && json.status === 'success') {
                        const d = json.data;
                        const isLayak = d.level === 2;
                        Swal.fire({
                            icon: isLayak ? 'success' : 'info',
                            title: isLayak ? 'Terdaftar & Disetujui BPS' : 'Terdaftar (Dalam Antrean Verifikasi)',
                            html: `
                                <div style="text-align:left; font-size:0.9rem; background:#f8fafc; padding:15px; border-radius:12px; border:1px solid #e2e8f0; line-height:1.7;">
                                    <div><b>Nama:</b> ${d.nama}</div>
                                    <div><b>NIK:</b> ${d.nik}</div>
                                    <div><b>Alamat:</b> ${d.alamat || '-'}</div>
                                    <div style="margin-top:6px;"><b>Status Kelayakan:</b> <span style="background:${isLayak ? '#dcfce7' : '#e0f2fe'}; color:${isLayak ? '#15803d' : '#0369a1'}; padding:3px 10px; border-radius:20px; font-weight:700;">${d.status}</span></div>
                                    <div style="margin-top:10px; font-size:0.8rem; color:#059669;"><i class="fas fa-shield-alt"></i> Data terverifikasi sesuai standar DTSEN / BPS Kabupaten Sidoarjo.</div>
                                </div>
                            `,
                            confirmButtonColor: '#10b981'
                        });
                    } else {
                        const dukcapilRes = await fetch(`${API_URL}/api/dukcapil/${nik}`).catch(() => null);
                        if (dukcapilRes && dukcapilRes.ok) {
                            const dukJson = await dukcapilRes.json();
                            const duk = dukJson.data;
                            Swal.fire({
                                icon: 'warning',
                                title: 'Belum Terdaftar di Bansos',
                                html: `
                                    <div style="text-align:left; font-size:0.9rem; line-height:1.6;">
                                        <p>NIK <b>${nik}</b> ditemukan pada data kependudukan atas nama <b>${duk.nama}</b>, tetapi <u>belum masuk</u> dalam daftar penerima bantuan.</p>
                                        <p style="margin-top:10px; color:#059669; font-weight:600;">Warga dapat mendaftar mandiri melalui Portal Warga.</p>
                                    </div>
                                `,
                                showCancelButton: true,
                                confirmButtonText: 'Buka Portal Warga',
                                cancelButtonText: 'Tutup',
                                confirmButtonColor: '#10b981'
                            }).then((r) => {
                                if (r.isConfirmed) window.location.href = 'publik.html';
                            });
                        } else {
                            Swal.fire({
                                icon: 'error',
                                title: 'Data Tidak Ditemukan',
                                text: `NIK ${nik} tidak ditemukan dalam basis data BPS maupun bansos.`,
                                confirmButtonColor: '#ef4444'
                            });
                        }
                    }
                } catch (e) {
                    Swal.fire('Koneksi Gagal', 'Gagal menghubungi server database.', 'error');
                }
            }
        }

        // 3. SUBMIT LOGIN DENGAN GENERASI TOKEN BARU
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!isSecure) return;

            const ansInput = document.getElementById('captchaAnswer');
            const answer = parseInt(ansInput ? ansInput.value : '0');
            if (answer !== expectedCaptcha) {
                Swal.fire('Anti-Bot Terpicu', 'Hasil penjumlahan matematika salah. Silakan coba kembali.', 'warning');
                generateCaptcha();
                return;
            }

            const btn = document.getElementById('btnSubmit');
            if (btn) {
                btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Memverifikasi...';
                btn.disabled = true;
            }

            try {
                const res = await fetch(`${API_URL}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: document.getElementById('username').value.trim(),
                        password: document.getElementById('password').value.trim()
                    })
                });

                const data = await res.json();
                if (res.ok && data.status === 'success') {
                    // Simpan token baru ke seluruh key penyimpanan lokal
                    localStorage.clear();
                    localStorage.setItem('token', data.access_token);
                    localStorage.setItem('bansosToken', data.access_token);
                    localStorage.setItem('user', JSON.stringify(data.data));
                    localStorage.setItem('bansosUser', JSON.stringify(data.data));

                    Swal.fire({
                        icon: 'success',
                        title: 'Akses Diterima',
                        text: `Selamat bertugas, ${data.data.username.toUpperCase()}!`,
                        showConfirmButton: false,
                        timer: 1000
                    }).then(() => {
                        window.location.href = 'index.html';
                    });
                } else {
                    Swal.fire({ icon: 'error', title: 'Akses Ditolak', text: data.message || 'Username atau password salah.' });
                    generateCaptcha();
                }
            } catch (err) {
                Swal.fire({
                    icon: 'error',
                    title: 'Koneksi Terputus',
                    text: 'Gagal terhubung ke backend Flask di port 5000. Pastikan server aktif.'
                });
            } finally {
                if (btn) {
                    btn.innerHTML = 'Login <i class="fas fa-sign-in-alt"></i>';
                    btn.disabled = false;
                }
            }
        });

        // 4. KONTROL MODAL LUPA SANDI
        function openResetModal() {
            const m = document.getElementById('resetModal');
            if (m) m.style.display = 'flex';
        }

        function closeResetModal() {
            const m = document.getElementById('resetModal');
            if (m) m.style.display = 'none';
        }

        function handleResetPassword(e) {
            e.preventDefault();
            Swal.fire({
                title: 'Pengajuan Terkirim',
                text: 'Permintaan reset kata sandi telah diteruskan ke Administrator Database.',
                icon: 'success',
                confirmButtonColor: '#10b981'
            });
            closeResetModal();
        }
    </script>
</body>
</html>
