<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>Akses Internal Dinas - SPK Bansos Kabupaten Sidoarjo</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">

    <style>
        :root {
            --primary: #009846;
            --primary-dark: #007a37;
            --primary-deep: #047857;
            --primary-light: #e6f9f0;
            --accent: #f59e0b;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --radius-card: 26px;
            --radius-input: 14px;
            --radius-btn: 14px;
            --shadow-card: 0 20px 45px -10px rgba(15, 23, 42, 0.08), 0 0 0 1px rgba(226, 232, 240, 0.8);
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body.page-login {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: 
                radial-gradient(circle at 12% 16%, rgba(16, 185, 129, 0.2) 0%, transparent 45%),
                radial-gradient(circle at 88% 84%, rgba(245, 158, 11, 0.14) 0%, transparent 45%),
                linear-gradient(180deg, #f0fdf4 0%, #f8fafc 100%);
            padding: 30px 18px;
            position: relative;
            overflow-x: hidden;
        }

        /* Navigasi Mengambang */
        .btn-top-tutorial {
            position: absolute;
            top: 26px;
            left: 28px;
            background: #0f172a;
            color: #ffffff;
            border: none;
            padding: 11px 22px;
            border-radius: 30px;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(15, 23, 42, 0.16);
            transition: all 0.25s ease;
            z-index: 20;
            text-decoration: none;
        }

        .btn-top-tutorial:hover {
            transform: translateY(-2px);
            background: #1e293b;
        }

        .btn-top-portal {
            position: absolute;
            top: 26px;
            right: 28px;
            background: #ffffff;
            color: var(--primary-dark);
            border: 1.5px solid #a7f3d0;
            padding: 11px 22px;
            border-radius: 30px;
            font-size: 0.85rem;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 6px 18px rgba(0, 152, 70, 0.08);
            transition: all 0.25s ease;
            z-index: 20;
            text-decoration: none;
        }

        .btn-top-portal:hover {
            transform: translateY(-2px);
            background: #f0fdf4;
            box-shadow: 0 10px 24px rgba(0, 152, 70, 0.16);
        }

        /* Tombol Bulat CEK BPS */
        .btn-floating-bps {
            position: fixed;
            bottom: 28px;
            right: 28px;
            width: 66px;
            height: 66px;
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            color: #ffffff;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 10px 26px rgba(37, 99, 235, 0.4);
            transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
            font-size: 0.72rem;
            font-weight: 900;
            letter-spacing: 0.5px;
            z-index: 50;
            border: 3px solid #ffffff;
            text-decoration: none;
            text-align: center;
            line-height: 1.15;
        }

        .btn-floating-bps:hover {
            transform: scale(1.08) translateY(-3px);
            box-shadow: 0 14px 30px rgba(37, 99, 235, 0.55);
        }

        /* Kartu Login Utama */
        .login-card-modern {
            background: #ffffff;
            width: 100%;
            max-width: 440px;
            border-radius: var(--radius-card);
            padding: 38px 36px 36px 36px;
            box-shadow: var(--shadow-card);
            position: relative;
            z-index: 10;
            text-align: center;
            animation: cardFade 0.3s ease-out;
            transition: box-shadow 0.3s ease, transform 0.3s ease;
        }

        .login-card-modern.highlight-card {
            box-shadow: 0 0 0 5px rgba(0, 152, 70, 0.35), 0 25px 50px rgba(0, 152, 70, 0.18);
            transform: scale(1.02);
        }

        @keyframes cardFade {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .sidoarjo-logo-wrapper {
            width: 78px;
            height: 78px;
            margin: 0 auto 16px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.06);
            border: 1px solid var(--border);
            padding: 6px;
        }

        .sidoarjo-logo-img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .login-header-title {
            font-size: 1.5rem;
            font-weight: 900;
            color: var(--primary-deep);
            letter-spacing: -0.3px;
            margin-bottom: 4px;
        }

        .login-header-sub {
            font-size: 0.88rem;
            color: var(--text-muted);
            font-weight: 600;
            margin-bottom: 22px;
        }

        .form-group-item {
            text-align: left;
            margin-bottom: 14px;
        }

        .form-label-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.83rem;
            font-weight: 700;
            color: #334155;
            margin-bottom: 6px;
        }

        .link-forgot-pass {
            color: #d97706;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.82rem;
            cursor: pointer;
        }

        .link-forgot-pass:hover {
            text-decoration: underline;
        }

        .input-box-field {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-element {
            width: 100%;
            padding: 12px 46px 12px 16px;
            border: 1.5px solid #cbd5e1;
            border-radius: var(--radius-input);
            background: #f8fafc;
            font-size: 0.94rem;
            font-weight: 600;
            color: var(--text-main);
            outline: none;
            transition: all 0.2s ease;
        }

        .input-element:focus {
            background: #ffffff;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(0, 152, 70, 0.14);
        }

        .toggle-pwd-btn {
            position: absolute;
            right: 12px;
            background: none;
            border: none;
            color: #64748b;
            cursor: pointer;
            padding: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            transition: color 0.2s ease;
        }

        .toggle-pwd-btn:hover {
            color: var(--primary-dark);
        }

        .security-badge-box {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px 14px;
            border: 1px solid #bbf7d0;
            border-radius: 12px;
            background: #f0fdf4;
            margin-bottom: 14px;
            font-size: 0.84rem;
            font-weight: 700;
            color: #15803d;
            letter-spacing: 0.2px;
        }

        .captcha-verify-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #fffbeb;
            padding: 10px 16px;
            border-radius: var(--radius-input);
            border: 1.5px dashed #f59e0b;
            margin-bottom: 18px;
        }

        .captcha-label-txt {
            font-weight: 800;
            font-size: 1rem;
            color: #b45309;
        }

        .captcha-input-field {
            width: 86px;
            padding: 8px;
            border: 2px solid #fcd34d;
            border-radius: 10px;
            text-align: center;
            font-weight: 800;
            font-size: 0.95rem;
            outline: none;
            background: #ffffff;
            color: var(--text-main);
        }

        .btn-submit-main {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #009846 0%, #007a37 100%);
            color: #ffffff;
            border: none;
            border-radius: var(--radius-btn);
            font-size: 0.98rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 8px 20px rgba(0, 152, 70, 0.28);
            transition: all 0.2s ease;
        }

        .btn-submit-main:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(0, 152, 70, 0.38);
            filter: brightness(1.04);
        }

        .btn-submit-main:active {
            transform: translateY(0);
        }

        /* Modal Reset Sandi */
        .modal-overlay-blur {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(8px);
            z-index: 9999;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-box-card {
            background: #ffffff;
            padding: 30px;
            border-radius: 24px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.3);
            text-align: left;
        }

        /* Kartu Panduan Interaktif */
        .interactive-guide-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 16px;
            margin-bottom: 12px;
            border-radius: 14px;
            border: 1.5px solid #e2e8f0;
            background: #ffffff;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
        }

        .interactive-guide-card:hover {
            transform: translateX(4px);
            border-color: #009846;
            background: #f0fdf4;
        }

        .guide-card-title {
            font-size: 0.92rem;
            font-weight: 800;
            color: #0f172a;
            margin-bottom: 3px;
        }

        .guide-card-desc {
            font-size: 0.81rem;
            color: #64748b;
            line-height: 1.45;
        }

        .guide-card-btn {
            color: #009846;
            font-weight: 800;
            font-size: 0.85rem;
            white-space: nowrap;
            margin-left: 12px;
        }

        @media (max-width: 640px) {
            .btn-top-tutorial { top: 16px; left: 16px; padding: 8px 16px; font-size: 0.8rem; }
            .btn-top-portal { top: 16px; right: 16px; padding: 8px 16px; font-size: 0.8rem; }
            .login-card-modern { padding: 30px 20px; margin-top: 40px; }
            .btn-floating-bps { bottom: 18px; right: 18px; width: 58px; height: 58px; font-size: 0.65rem; }
        }
    </style>
</head>
<body class="page-login">

    <!-- Tombol Navigasi Mengambang Atas -->
    <button type="button" onclick="mulaiTurLogin()" class="btn-top-tutorial">
        Panduan Login
    </button>
    <a href="publik.html" class="btn-top-portal" title="Akses Portal Warga">
        Portal Warga
    </a>

    <!-- Tombol Bulat Tunggal CEK BPS -->
    <div class="btn-floating-bps" id="floatingBpsBtn" onclick="cekDataBPS()" title="Cek Status Bansos Berdasarkan NIK">
        <span>CEK<br>BPS</span>
    </div>

    <!-- Kartu Login Utama -->
    <div class="login-card-modern" id="mainLoginCard">
        <!-- Logo Kabupaten Sidoarjo -->
        <div class="sidoarjo-logo-wrapper">
            <img src="static/img/logo-sidoarjo.png" 
                 onerror="this.onerror=null; this.src='https://upload.wikimedia.org/wikipedia/commons/7/70/Lambang_Kabupaten_Sidoarjo.png';" 
                 alt="Lambang Kabupaten Sidoarjo" 
                 class="sidoarjo-logo-img">
        </div>

        <h2 class="login-header-title">Akses Internal Dinas</h2>
        <p class="login-header-sub">Pemerintah Kabupaten Sidoarjo</p>

        <form id="loginForm">
            <div class="form-group-item">
                <div class="form-label-row">
                    <span>Username Pegawai</span>
                </div>
                <div class="input-box-field">
                    <input type="text" id="username" class="input-element" required autocomplete="username" placeholder="Masukkan username">
                </div>
            </div>

            <div class="form-group-item">
                <div class="form-label-row">
                    <span>Kata Sandi Akses</span>
                    <a class="link-forgot-pass" onclick="openResetModal()">Lupa Sandi?</a>
                </div>
                <div class="input-box-field">
                    <input type="password" id="password" class="input-element" required autocomplete="current-password" placeholder="Masukkan kata sandi">
                    <button type="button" class="toggle-pwd-btn" id="btnTogglePwd" onclick="togglePasswordVisibility()" title="Tampilkan/Sembunyikan Kata Sandi">
                        <svg id="eyeIconSvg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Status Keamanan Koneksi -->
            <div class="security-badge-box">
                Koneksi terenkripsi
            </div>

            <!-- Captcha Interaktif -->
            <div class="captcha-verify-card" id="captchaBox">
                <div class="captcha-label-txt">
                    <span id="captchaQuestion">4 + 3 =</span>
                </div>
                <input type="number" id="captchaAnswer" class="captcha-input-field" placeholder="Hasil?" required>
            </div>

            <button type="submit" id="btnSubmit" class="btn-submit-main">
                MASUK DASHBOARD
            </button>
        </form>
    </div>

    <!-- Modal Reset Sandi -->
    <div class="modal-overlay-blur" id="resetModal">
        <div class="modal-box-card">
            <h3 style="margin: 0 0 8px 0; color: var(--text-main); font-size:1.25rem; font-weight:800;">
                Pemulihan Akun
            </h3>
            <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 16px; line-height: 1.5;">
                Silakan masukkan data akun Anda untuk mengajukan permohonan reset kata sandi ke Administrator.
            </p>
            <form onsubmit="handleResetPassword(event)">
                <div class="form-group-item">
                    <label style="font-size:0.82rem; font-weight:700; display:block; margin-bottom:4px;">Username</label>
                    <input type="text" id="resetUser" class="input-element" placeholder="Username Anda" required>
                </div>
                <div class="form-group-item">
                    <label style="font-size:0.82rem; font-weight:700; display:block; margin-bottom:4px;">Kata Sandi Baru yang Diinginkan</label>
                    <input type="password" id="resetNewPass" class="input-element" placeholder="Minimal 6 karakter" required>
                </div>
                <div style="display:flex; gap:10px; margin-top:16px;">
                    <button type="button" onclick="closeResetModal()" class="btn-submit-main" style="background:#f1f5f9; color:#475569; box-shadow:none; flex:1;">Batal</button>
                    <button type="submit" class="btn-submit-main" style="flex:2;">Kirim Permintaan</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Pustaka Eksternal -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- Modul Inti Sesi Terpadu -->
    <script src="static/js/core/config.js"></script>
    <script src="static/js/core/auth.js"></script>
    <script src="static/js/core/api.js"></script>

    <script>
        let expectedCaptcha = 0;

        if (window.Auth && typeof window.Auth.isAuthenticated === 'function' && window.Auth.isAuthenticated()) {
            window.location.replace('index.html');
        }

        window.addEventListener('DOMContentLoaded', () => {
            generateCaptcha();
        });

        function generateCaptcha() {
            const num1 = Math.floor(Math.random() * 8) + 2;
            const num2 = Math.floor(Math.random() * 7) + 1;
            expectedCaptcha = num1 + num2;
            const qEl = document.getElementById('captchaQuestion');
            const ansEl = document.getElementById('captchaAnswer');
            if (qEl) qEl.innerText = `${num1} + ${num2} =`;
            if (ansEl) ansEl.value = '';
        }

        function togglePasswordVisibility() {
            const passInput = document.getElementById('password');
            const eyeSvg = document.getElementById('eyeIconSvg');
            if (!passInput || !eyeSvg) return;

            if (passInput.type === 'password') {
                passInput.type = 'text';
                eyeSvg.innerHTML = `
                    <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"></path>
                    <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"></path>
                    <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"></path>
                    <line x1="2" y1="2" x2="22" y2="22"></line>
                `;
            } else {
                passInput.type = 'password';
                eyeSvg.innerHTML = `
                    <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                `;
            }
        }

        // Panduan Akses Interaktif Lengkap
        function mulaiTurLogin() {
            Swal.fire({
                title: 'Panduan Akses Layanan Sistem Bansos',
                html: `
                    <div style="margin-top: 10px;">
                        <div class="interactive-guide-card" onclick="aksiPanduan('login')">
                            <div>
                                <div class="guide-card-title">1. Masuk Dasbor Pegawai & Operator</div>
                                <div class="guide-card-desc">Khusus aparatur dinas sosial dan verifikator untuk mengelola SPK BWM-SAW, validasi lapangan, dan penyaluran.</div>
                            </div>
                            <span class="guide-card-btn">Menuju Form &rarr;</span>
                        </div>

                        <div class="interactive-guide-card" onclick="aksiPanduan('portal')">
                            <div>
                                <div class="guide-card-title">2. Portal Warga & Pendaftaran Mandiri</div>
                                <div class="guide-card-desc">Kanal publik masyarakat untuk mengajukan pendaftaran bansos mandiri, melihat syarat bantuan, dan konsultasi keluhan.</div>
                            </div>
                            <span class="guide-card-btn">Buka Portal &rarr;</span>
                        </div>

                        <div class="interactive-guide-card" onclick="aksiPanduan('bps')">
                            <div>
                                <div class="guide-card-title">3. Cek Status Penerima Bansos (BPS)</div>
                                <div class="guide-card-desc">Pemeriksaan cepat berbasis NIK 16 digit untuk mengetahui apakah keluarga Anda sudah terdaftar sebagai penerima bansos.</div>
                            </div>
                            <span class="guide-card-btn">Periksa NIK &rarr;</span>
                        </div>
                    </div>
                `,
                showConfirmButton: false,
                showCloseButton: true
            });
        }

        // Aksi Pengarah Langsung dari Modal Panduan
        function aksiPanduan(tujuan) {
            Swal.close();
            if (tujuan === 'login') {
                const card = document.getElementById('mainLoginCard');
                card.classList.add('highlight-card');
                setTimeout(() => card.classList.remove('highlight-card'), 1600);
                document.getElementById('username')?.focus();
            } else if (tujuan === 'portal') {
                window.location.href = 'publik.html';
            } else if (tujuan === 'bps') {
                cekDataBPS();
            }
        }

        // Cek BPS: Memeriksa Status Penerima Bansos (Tanpa Desil)
        async function cekDataBPS() {
            const { value: nik } = await Swal.fire({
                title: 'Cek Status Penerima Bansos',
                html: '<p style="font-size:0.86rem; color:#64748b; margin-bottom:10px;">Masukkan 16 digit NIK Anda untuk memeriksa status pendaftaran penerima bansos:</p>',
                input: 'text',
                inputPlaceholder: 'Contoh: 3515xxxxxxxxxxxx',
                inputAttributes: { maxlength: '16' },
                showCancelButton: true,
                confirmButtonText: 'Periksa NIK',
                cancelButtonText: 'Batal',
                confirmButtonColor: '#009846',
                inputValidator: (val) => {
                    if (!val || val.trim().length !== 16 || !/^\d+$/.test(val.trim())) {
                        return 'Mohon masukkan 16 digit angka NIK yang valid!';
                    }
                }
            });

            if (nik) {
                Swal.fire({
                    title: 'Memeriksa Basis Data...',
                    text: `Mencocokkan NIK ${nik} dengan data penerima bansos Kabupaten Sidoarjo...`,
                    allowOutsideClick: false,
                    didOpen: () => Swal.showLoading()
                });

                try {
                    const baseUrl = window.API_BASE_URL || (window.CONFIG && window.CONFIG.BASE_URL) || 'http://127.0.0.1:5000';
                    const res = await fetch(`${baseUrl}/api/publik/cek-bansos?nik=${nik}`);
                    const json = await res.json();

                    if (res.ok && json.data) {
                        const d = json.data;
                        const isMenerima = (d.status_bansos && d.status_bansos.toLowerCase().includes('menerima')) || 
                                           (d.status_salur && d.status_salur.toLowerCase() !== 'pending');

                        Swal.fire({
                            icon: isMenerima ? 'success' : 'info',
                            title: isMenerima ? 'Terdaftar Sebagai Penerima Bansos' : 'Belum Terdaftar Penerima Bansos',
                            html: `
                                <div style="text-align:left; font-size:0.9rem; background:#f8fafc; padding:16px; border-radius:12px; border:1px solid #e2e8f0; line-height:1.7;">
                                    <div><b>Nama:</b> ${d.nama_lengkap}</div>
                                    <div><b>NIK:</b> ${d.nik}</div>
                                    <div><b>Alamat:</b> ${d.alamat || 'Sidoarjo'}</div>
                                    <div style="margin-top:6px;"><b>Status Bansos:</b> <span style="background:${isMenerima ? '#dcfce7' : '#fee2e2'}; color:${isMenerima ? '#15803d' : '#b91c1c'}; padding:3px 10px; border-radius:12px; font-weight:800;">${isMenerima ? 'Terdaftar Menerima Bansos' : 'Belum Terdaftar'}</span></div>
                                    <div><b>Status Penyaluran:</b> ${d.status_salur || 'Belum Disalurkan'}</div>
                                </div>
                            `,
                            confirmButtonColor: '#009846'
                        });
                    } else {
                        Swal.fire({
                            icon: 'warning',
                            title: 'Data Belum Terdaftar',
                            text: 'NIK Anda belum tercatat sebagai penerima bansos. Silakan lakukan pendaftaran melalui Portal Warga.',
                            showCancelButton: true,
                            confirmButtonText: 'Buka Portal Warga',
                            cancelButtonText: 'Tutup',
                            confirmButtonColor: '#009846'
                        }).then((r) => {
                            if (r.isConfirmed) window.location.href = 'publik.html';
                        });
                    }
                } catch (e) {
                    Swal.fire('Koneksi Terputus', 'Gagal menghubungi server database.', 'error');
                }
            }
        }

        // Form Submit Handler
        document.getElementById('loginForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            const ansInput = document.getElementById('captchaAnswer');
            const answer = parseInt(ansInput ? ansInput.value : '0');
            if (answer !== expectedCaptcha) {
                Swal.fire('Verifikasi Gagal', 'Hasil perhitungan matematika salah. Silakan ulangi.', 'warning');
                generateCaptcha();
                return;
            }

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const btn = document.getElementById('btnSubmit');

            btn.disabled = true;
            btn.innerText = 'MEMVERIFIKASI...';

            try {
                const result = await window.Auth.login(username, password);

                if (result && result.success) {
                    Swal.fire({
                        icon: 'success',
                        title: 'Akses Diterima',
                        text: `Selamat bertugas, ${result.user.toUpperCase()}!`,
                        timer: 1100,
                        showConfirmButton: false
                    }).then(() => {
                        window.location.replace('index.html');
                    });
                } else {
                    btn.disabled = false;
                    btn.innerText = 'MASUK DASHBOARD';
                    generateCaptcha();
                }
            } catch (err) {
                btn.disabled = false;
                btn.innerText = 'MASUK DASHBOARD';
                generateCaptcha();
            }
        });

        function openResetModal() {
            document.getElementById('resetModal').style.display = 'flex';
        }

        function closeResetModal() {
            document.getElementById('resetModal').style.display = 'none';
        }

        function handleResetPassword(e) {
            e.preventDefault();
            Swal.fire({
                title: 'Permintaan Diterima',
                text: 'Permintaan pembaruan kata sandi telah diteruskan ke Administrator Database.',
                icon: 'success',
                confirmButtonColor: '#009846'
            });
            closeResetModal();
        }
    </script>
</body>
</html>
