version: '3.8'

services:
  # =========================================================================
  # 1. DATABASE SERVICE (MySQL 8.0)
  # =========================================================================
  db:
    image: mysql:8.0
    container_name: bansos_mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: bansos
      MYSQL_USER: bansos_user
      MYSQL_PASSWORD: bansos_password
      TZ: Asia/Jakarta
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/database.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - bansos_network

  # =========================================================================
  # 2. BACKEND API SERVICE (Flask, SQLAlchemy, Gunicorn)
  # =========================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bansos_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - FLASK_APP=app.py
      - FLASK_ENV=production
      - PYTHONUNBUFFERED=1
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=bansos
      - DB_USER=root
      - DB_PASSWORD=rootpassword
      - DATABASE_URL=mysql+mysqlconnector://root:rootpassword@db:3306/bansos
      - UPLOAD_FOLDER=static/uploads
      - MAX_CONTENT_LENGTH=104857600
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - ./backend/static/uploads:/app/static/uploads
      - ./db:/app/db
    depends_on:
      db:
        condition: service_healthy
    networks:
      - bansos_network

  # =========================================================================
  # 3. FRONTEND PORTAL SERVICE (PWA & Web Client via Nginx)
  # =========================================================================
  frontend:
    image: nginx:alpine
    container_name: bansos_frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - bansos_network

  # =========================================================================
  # 4. DATABASE MANAGEMENT GUI (phpMyAdmin)
  # =========================================================================
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: bansos_phpmyadmin
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 64M
    depends_on:
      db:
        condition: service_healthy
    networks:
      - bansos_network

# =========================================================================
# NETWORKS & PERSISTENT VOLUMES
# =========================================================================
networks:
  bansos_network:
    name: bansos_network
    driver: bridge

volumes:
  mysql_data:
    name: bansos_mysql_data
    driver: local