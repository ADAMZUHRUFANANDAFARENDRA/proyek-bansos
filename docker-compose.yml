version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bansos_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - ./backend/static/uploads:/app/static/uploads
      - ./backend:/app
      - ./db:/app/db
    environment:
      - FLASK_ENV=production
      - PYTHONUNBUFFERED=1
    networks:
      - bansos_network

  frontend:
    image: nginx:alpine
    container_name: bansos_frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html
    depends_on:
      - backend
    networks:
      - bansos_network

networks:
  bansos_network:
    driver: bridge